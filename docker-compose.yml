services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: moodify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moods}
      POSTGRES_USER: ${DB_USER:-ever}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-first_commit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-ever}:${DB_PASSWORD:-first_commit}@postgres:5432/${DB_NAME:-moods}?sslmode=disable
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/uploads
      MAX_FILE_SIZE_MB: 35
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moodify-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads_data:
