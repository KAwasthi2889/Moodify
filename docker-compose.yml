services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: moodify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moodify}
      POSTGRES_USER: ${DB_USER:-moodify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moodify_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moodify} -d ${DB_NAME:-moodify}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
