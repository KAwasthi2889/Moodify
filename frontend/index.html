<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moodify — Audio Intelligence in 64 Dimensions</title>
  <meta name="description" content="Production-grade acoustic intelligence and continuous mood clustering platform with multimodal 64-D audio embeddings, dynamic suitability playlists, and synchronized lyrics." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f0ff'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>" />

  <!-- Google Fonts: Outfit (Display) + Plus Jakarta Sans (Body) + JetBrains Mono (Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient Dynamic Mood Aura -->
  <div class="dynamic-aura" id="dynamic-aura" aria-hidden="true"></div>

  <!-- Three.js Kinetic Soundwave Canvas -->
  <canvas id="webgl-canvas" aria-hidden="true"></canvas>

  <div id="app">
    <!-- Application Header -->
    <header class="app-header">
      <div class="brand-section" id="header-brand">
        <div class="brand-logo" aria-label="Moodify Logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">
            Moodify
            <span class="brand-badge">2.0</span>
          </div>
          <span class="brand-subtitle">64-D Audio Intelligence</span>
        </div>
      </div>

      <!-- Landing Navigation Links -->
      <nav class="landing-nav-links" id="landing-nav-links">
        <a href="#architecture" class="landing-nav-link" id="nav-link-pipeline">Pipeline</a>
        <a href="#hyperspace" class="landing-nav-link" id="nav-link-hyperspace">Vector Hyperspace</a>
        <button class="nav-workshop-pill" id="nav-btn-workshop">
          <span>Workshop</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </nav>

      <!-- Header Actions -->
      <div class="header-actions">
        <!-- 3-Line Hamburger Menu for Library Drawer -->
        <button class="btn-hamburger" id="btn-open-session-drawer" title="View Library" aria-label="Open Track Library">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Viewport -->
    <main class="main-container">
      <div id="tab-view-container" role="region" aria-live="polite"></div>
    </main>

    <!-- Docked Persistent Audio Player -->
    <div id="persistent-player-container"></div>
  </div>

  <!-- Slide-out Session Drawer Mount -->
  <div id="session-drawer-mount"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
